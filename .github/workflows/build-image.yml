name: Build & Push Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'build.sh'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (default: latest)'
        default: 'latest'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/shmitzas/cs2-ptero-egg:${{ inputs.tag || 'latest' }}
            ghcr.io/shmitzas/cs2-ptero-egg:${{ github.sha }}
